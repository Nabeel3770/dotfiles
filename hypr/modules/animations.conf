# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    # ===== BEZIERS (macOS feel) =====
    bezier = macOS, 0.25, 0.1, 0.25, 1
    bezier = easeOut, 0.22, 1, 0.36, 1
    bezier = easeIn, 0.55, 0, 0.1, 1
    bezier = linear, 0, 0, 1, 1

    # ===== GLOBAL =====
    animation = global, 1, 6, macOS

    # ===== WINDOWS =====
    animation = windows,    1, 6, easeOut
    animation = windowsIn,  1, 6, easeOut, popin 92%
    animation = windowsOut, 1, 5, easeIn,  popin 88%

    # ===== NO FADE (important for no overlap feel) =====
    animation = fade, 0
    animation = fadeIn, 0
    animation = fadeOut, 0

    # ===== WORKSPACES (macOS swipe) =====
    animation = workspaces,    1, 6, macOS, slide
    animation = workspacesIn,  1, 5, macOS, slide
    animation = workspacesOut, 1, 5, macOS, slide

    # ===== LAYERS (rofi / swaync) =====
    animation = layers,    1, 5, easeOut
    animation = layersIn,  1, 5, easeOut, fade
    animation = layersOut, 1, 4, easeIn,  fade

    # ===== BORDER =====
    animation = border, 1, 3, macOS
    animation = borderangle, 1, 4, macOS

    # ===== SPECIAL WORKSPACE =====
    animation = specialWorkspace, 1, 5, easeOut, slide

    # ===== ZOOM =====
    animation = zoomFactor, 1, 6, easeOut
}
